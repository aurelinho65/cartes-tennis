<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Point — raretés</title>
<style>
@font-face { font-family: 'Barlow Condensed'; font-weight: 500; src: url(assets/fonts/barlow-condensed-500.woff2) format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(assets/fonts/barlow-condensed-600.woff2) format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(assets/fonts/barlow-condensed-700.woff2) format('woff2'); }
:root {
  --fond: #15171b; --surface: #1d2026; --trait: #2c3038; --texte: #eceae4; --discret: #9a9ea8; --accent: #d7f34a;
  font-family: 'Barlow Condensed', 'Bahnschrift SemiCondensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); }
header { max-width: 1320px; margin: 0 auto; padding: 32px 16px 8px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
h1 span { color: var(--accent); }
header p { margin: 4px 0 0; color: var(--discret); font-size: 17px; letter-spacing: .02em; }
.reglages { display: flex; flex-wrap: wrap; gap: 8px; }
.reglages label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--trait); border-radius: 999px; background: var(--surface); font-size: 16px; letter-spacing: .04em; cursor: pointer; user-select: none; }
.reglages input[type=checkbox] { accent-color: var(--accent); }
.reglages input[type=file] { display: none; }
main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px 28px; }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.scene { width: 100%; max-width: 300px; perspective: 900px; }
.carte { position: relative; aspect-ratio: 600 / 830; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2,.7,.2,1); filter: drop-shadow(0 18px 24px rgba(0,0,0,.55)); }
.carte.actif { transition: transform .08s linear; }
.carte svg { display: block; width: 100%; height: 100%; }
/* Lumière et film holographique, découpés par la silhouette exacte (masque CSS). */
.carte .lumiere, .carte .holo { position: absolute; inset: 0; pointer-events: none; -webkit-mask: var(--masque) center / 100% 100% no-repeat; mask: var(--masque) center / 100% 100% no-repeat; opacity: 0; transition: opacity .4s; }
.carte .lumiere { background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,.28), rgba(255,255,255,0) 45%); mix-blend-mode: soft-light; }
.carte .holo { background: linear-gradient(115deg, transparent 20%, #ff8ad8 32%, #8fd4ff 42%, #b6ffb0 52%, #fff1a0 62%, transparent 76%) calc(var(--mx, 50%) * 1.6 - 30%) 0 / 220% 100%; mix-blend-mode: color-dodge; }
.carte:hover .lumiere { opacity: 1; }
.carte[data-rarete=elite]:hover .holo { opacity: .12; }
.carte[data-rarete=legende]:hover .holo { opacity: .22; }
figcaption { text-align: center; max-width: 300px; }
figcaption b { display: block; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; }
figcaption span { display: block; color: var(--discret); font-size: 16px; line-height: 1.35; margin-top: 4px; min-height: 2.7em; }
figcaption button { margin-top: 10px; font: inherit; font-size: 15px; letter-spacing: .06em; color: var(--texte); background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
figcaption button:hover { border-color: var(--discret); }
footer { max-width: 1320px; margin: 0 auto; padding: 0 16px 40px; color: var(--discret); font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .carte { transition: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Match <span>Point</span></h1>
    <p>Une silhouette, quatre matières : gazon, terre battue, dur de nuit, court central.</p>
  </div>
  <div class="reglages">
    <label><input type="checkbox" id="donnees" checked> Données</label>
    <label><input type="checkbox" id="buste"> Buste de test</label>
    <label><input type="checkbox" id="reperes"> Zone photo</label>
    <label><input type="checkbox" id="trajectoire" checked> Trajectoire</label>
    <label>Photo… <input type="file" id="photo" accept="image/*"></label>
  </div>
</header>
<main id="galerie"></main>
<footer>Survolez une carte pour l'incliner. « Télécharger » enregistre le SVG affiché (fond seul si « Données » est décoché).</footer>

<script type="module">
import { creerCarte } from './src/carte.js';
import { RARETES, ORDRE } from './src/raretes.js';
import { JOUEURS } from './src/joueurs.js';
import { svgSilhouette } from './src/silhouette.js';

const MATIERES = {
  classique: 'Gazon tondu en bandes, craie ivoire, jonc ivoire mat.',
  rare: 'Terre battue grainée, traces de traîne, double jonc cuivre.',
  elite: 'Résine de court dur sablée, projecteurs, jonc chromé, trajectoire jaune optique.',
  legende: 'Onyx et or champagne, rosace guillochée, film holographique, pierres serties, numérotée.',
};
const masque = `url("data:image/svg+xml,${encodeURIComponent(svgSilhouette())}")`;
const galerie = document.getElementById('galerie');
const champ = (id) => document.getElementById(id);
let photo = null;

function options() {
  return { donnees: champ('donnees').checked, buste: champ('buste').checked, reperes: champ('reperes').checked, trajectoire: champ('trajectoire').checked, photo };
}

function rendre() {
  const o = options();
  galerie.innerHTML = '';
  for (const r of ORDRE) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<div class="scene"><div class="carte" data-rarete="${r}" style="--masque:${masque}">
${creerCarte({ rarete: r, id: `g-${r}`, joueur: JOUEURS[r], options: o })}<div class="holo"></div><div class="lumiere"></div></div></div>
<figcaption><b>${RARETES[r].nom}</b><span>${MATIERES[r]}</span><button type="button">Télécharger le SVG</button></figcaption>`;
    fig.querySelector('button').onclick = () => telecharger(r, o);
    inclinaison(fig.querySelector('.carte'));
    galerie.append(fig);
  }
}

function inclinaison(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.addEventListener('pointermove', (e) => {
    const b = el.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
    el.classList.add('actif');
    el.style.setProperty('--ry', `${(x - 0.5) * 16}deg`);
    el.style.setProperty('--rx', `${(0.5 - y) * 12}deg`);
    el.style.setProperty('--mx', `${x * 100}%`);
    el.style.setProperty('--my', `${y * 100}%`);
  });
  el.addEventListener('pointerleave', () => {
    el.classList.remove('actif');
    el.style.setProperty('--rx', '0deg');
    el.style.setProperty('--ry', '0deg');
  });
}

function telecharger(r, o) {
  const svg = creerCarte({ rarete: r, id: r, joueur: JOUEURS[r], options: { ...o, photo: null } });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  a.download = o.donnees ? `carte-${r}.svg` : `fond-${r}.svg`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

for (const id of ['donnees', 'buste', 'reperes', 'trajectoire']) champ(id).addEventListener('change', rendre);
champ('photo').addEventListener('change', (e) => {
  const fichier = e.target.files[0];
  if (!fichier) return;
  const lecteur = new FileReader();
  lecteur.onload = () => { photo = lecteur.result; rendre(); };
  lecteur.readAsDataURL(fichier);
});
rendre();
</script>
</body>
</html>
